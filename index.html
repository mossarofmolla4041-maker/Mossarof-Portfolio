<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mossarof Molla — Junior Accounts Officer Portfolio</title>
    <meta
      name="description"
      content="Personal portfolio website of Mossarof Molla (Badda, Dhaka, Bangladesh) targeting Junior Accounts Officer roles, featuring accounting, TallyPrime, MS Excel, training, experience, and CV download."
    />
    <meta property="og:title" content="Mossarof Molla — Junior Accounts Officer Portfolio" />
    <meta
      property="og:description"
      content="Personal portfolio website of Mossarof Molla featuring bookkeeping, TallyPrime, MS Excel, work experience, and CV download."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('mm_portfolio_theme');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white text-[#0A192F] antialiased selection:bg-[#0F294A] selection:text-white dark:bg-[#060E1A] dark:text-slate-100 dark:selection:bg-blue-500 dark:selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
